<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210.0" width="880" role="img" aria-label="Before the replacement, the graph filters the orders to paid orders, and then it sums the amount for each region. In the replacement, the filter is gone and the sum uses all orders."><title>Before the replacement, the graph filters the orders to paid orders, and then it sums the amount for each region. In the replacement, the filter is gone and the sum uses all orders.</title><style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #1c222c; }
text.m { fill: #5c6470; } text.s { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 14.5px; } text.h { font-weight: 600; }
.ax { stroke: #d6cfc0; stroke-width: 1; fill: none; } .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.sb { stroke: #0F86B0; } .sr { stroke: #A8501C; } .sg { stroke: #9A7400; } .sm { stroke: #5c6470; } .si { stroke: #1c222c; } .sx { stroke: #C23A2E; }
.fb { fill: #0F86B0; } .fr { fill: #A8501C; } .fg { fill: #9A7400; } .fx, text.fx { fill: #C23A2E; } .fbg, text.fbg { fill: #f6f3ec; } .fp { fill: #eee9dd; } .fn { fill: none; } .fm { fill: #5c6470; }
.box { fill: #eee9dd; stroke: #d6cfc0; stroke-width: 1.5; } .dash { stroke-dasharray: 5 5; }
text.halo { paint-order: stroke; stroke: #f6f3ec; stroke-width: 4px; stroke-linejoin: round; }
.chip.on rect { stroke: #9A7400; stroke-width: 2.5; }
</style><rect x="0" y="0" width="880" height="210.0" rx="8" fill="#f6f3ec"/>
        <defs><marker id="aj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fm"></path></marker></defs>
        <text x="40" y="66" class="s">before</text>
        <rect x="170" y="40" width="100" height="44" rx="6" class="box"></rect><text x="220" y="66" text-anchor="middle">orders</text>
        <rect x="320" y="40" width="180" height="44" rx="6" class="box"></rect><text x="410" y="66" text-anchor="middle">status = paid</text>
        <rect x="550" y="40" width="170" height="44" rx="6" class="box"></rect><text x="635" y="66" text-anchor="middle">sum(amount)</text>
        <rect x="770" y="40" width="90" height="44" rx="6" class="box"></rect><text x="815" y="66" text-anchor="middle">totals</text>
        <path d="M270 62H316" class="ln sm" marker-end="url(#aj)"></path><path d="M500 62H546" class="ln sm" marker-end="url(#aj)"></path><path d="M720 62H766" class="ln sm" marker-end="url(#aj)"></path>
        <text x="40" y="166" class="s">a replacement</text>
        <rect x="170" y="140" width="100" height="44" rx="6" class="box"></rect><text x="220" y="166" text-anchor="middle">orders</text>
        <path d="M270 162H546" class="ln sm" marker-end="url(#aj)"></path>
        <rect x="320" y="140" width="180" height="44" rx="6" class="fn sx dash" stroke-width="1.5"></rect><text x="410" y="130" text-anchor="middle" class="fx">the filter is gone</text>
        <rect x="550" y="140" width="170" height="44" rx="6" class="box"></rect><text x="635" y="166" text-anchor="middle">sum(amount_usd)</text>
        <rect x="770" y="140" width="90" height="44" rx="6" class="box"></rect><text x="815" y="166" text-anchor="middle">totals</text>
        <path d="M720 162H766" class="ln sm" marker-end="url(#aj)"></path>
      </svg>
