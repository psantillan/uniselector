# Uniselector configuration. Copy to uniselector.toml.

# The hard limits. The user decides them. They have no default.
[limits]
budget_tokens = 400000   # input tokens of the decision model, for one run
wall_seconds = 1800      # seconds that one run works. The clock stops while the run waits for the main agent or the human

# Where the DataHandles runtime is: a state directory, or the URL of a DataHandles HTTP server.
# With a URL, each principal needs a bearer token in the environment:
#   UNISELECTOR_PLANNER_TOKEN, UNISELECTOR_TOKEN, UNISELECTOR_HUMAN_TOKEN
[runtime]
target = ".datahandles"
runs_dir = ".uniselector/runs"

# The decision model: a model behind a Decisions API. At one look it reads the state and one `noul`
# question for each essential variable, and it gives the probability that each one is true. The
# API key is in the environment variable that decision_key_env names. It is not in this file.
[decision]
decision_url = "https://openrouter.ai/api/alpha/decisions"
decision_model = "perplexity/pplx-decider-v1.2"
decision_key_env = "OPENROUTER_API_KEY"

# Capabilities that only the human can confirm. The main agent cannot approve them.
[actions]
human_only = []
