# Uniselector configuration. Copy to uniselector.toml.

# The hard limits. The user decides them. They have no default.
[limits]
budget_tokens = 5000000  # tokens of the decision model (input) and of the model runners (input + output), for one run
wall_seconds = 1800      # seconds that one run works. The clock stops while the run waits for the main agent or the human

# Where the DataHandles runtime is: a state directory, or the URL of a DataHandles HTTP server.
# With a URL, each principal needs a bearer token in the environment:
#   UNISELECTOR_PLANNER_TOKEN, UNISELECTOR_TOKEN, UNISELECTOR_HUMAN_TOKEN
[runtime]
target = ".datahandles"
runs_dir = ".uniselector/runs"

# The decision model: a model behind a Decisions API. At one look it reads the state and one `noul`
# question for each essential variable, and it gives the probability that each one is true. The
# API key is in the environment variable that decision_key_env names. It is not in this file.
[decision]
decision_url = "https://openrouter.ai/api/alpha/decisions"
decision_model = "perplexity/pplx-decider-v1.2"
decision_key_env = "OPENROUTER_API_KEY"

# Capabilities that only the human can confirm. The main agent cannot approve them.
[actions]
human_only = []

# Runners: what an object can name in its `runners`, and a form of an object in its `runners`.
# A runner does nothing while each variable is inside its limits. At a wake, it gives one
# replacement of an object, or it makes a form of an output (a summary, an embedding).
# It works as the orchestrator's principal, so the runtime gives it no action.
#
# A table with `url` is a model runner: a chat model that makes one request for one wake. The
# request has the object, the graph that made its handle, and the fault of each step of the graph.
# The reply names the steps that change. `url` is a chat completions API in the OpenAI form.
# `key_env` names the environment variable with the API key, when the API needs one. `body` has
# more keys for each request, when the server of the model needs them. The names `main` (the main
# agent) and `human` need no table.
#
# Before you name a local model, read the context that its server gives it. A server can give less
# than the model has: Ollama gives 4,096 tokens when no one sets `num_ctx`.
#
# [runners.local]
# url = "http://127.0.0.1:8000/v1/chat/completions"
# model = "a-local-model"
# body = { chat_template_kwargs = { enable_thinking = false } }
#
# [runners.top]
# url = "https://openrouter.ai/api/v1/chat/completions"
# model = "a-large-model"
# key_env = "OPENROUTER_API_KEY"
#
# A table with `call` is a function of your code: `FILE.py:NAME` or `MODULE:NAME`. Uniselector
# calls NAME(client, ...) one time, with the DataHandles client of the orchestrator's principal and
# each other key of the table as an argument. NAME returns the runner: a function
# runner(question, submit, spend, seconds). The runner calls submit with the repair
# {"handle": ID, "operation": {...}}, or with the value of the form.
#
# [runners.embedder]
# call = "/home/me/runners.py:embedder"
# directory = "/home/me/vectors"

# Can a plan name code that the main agent wrote, as `FILE.py:NAME` in the runners of an object?
# That code runs in the process of Uniselector. With a state directory as the target, it can do
# what each principal can do, and the action gate does not stop it. The user decides this.
# [code]
# plan_callables = false
