[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uniselector"
version = "0.4.0"
description = "An Ashby regulator for long-horizon agent work, built on DataHandles."
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Santillan" }]
requires-python = ">=3.11"
# DataHandles is pinned to one tag. For local work on both repositories, install the local
# checkout over it:  pip install -e ../datahandles
dependencies = [
    "datahandles[duckdb,mcp] @ git+https://github.com/psantillan/datahandles@v0.4.1",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uniselector-mcp = "uniselector.mcp:main"
uniselector-confirm = "uniselector.confirm:main"
uniselector-hook = "uniselector.hooks.pending:main"

# The task fixtures of docs/FAILURES.md are a second package. They hold one resource adapter, and
# an adapter is part of a DataHandles runtime, not of the orchestrator.
[project.entry-points."datahandles.adapters"]
script = "uniselector_tasks.adapters:ScriptAdapter"

[tool.setuptools]
packages = ["uniselector", "uniselector.hooks", "uniselector_tasks"]

[tool.setuptools.package-dir]
uniselector = "uniselector"
uniselector_tasks = "tasks"

[tool.pytest.ini_options]
testpaths = ["tests"]
